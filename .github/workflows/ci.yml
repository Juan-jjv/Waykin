name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "backend[dev]"
      - run: cd backend && ruff check .
      - run: cd backend && pytest -q -m "not timing"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run lint:words

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -e "backend[dev]" && cd frontend && npm ci
      - name: Generated types match schemas.py
        run: |
          cd backend && WAYKIN_MOCK=1 uvicorn waykin.main:app --port 8000 & sleep 5
          cd frontend && npm run gen:types
          git diff --exit-code -- src/api/types.gen.ts

  no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No EPS data or build artifacts are tracked
        run: |
          if git ls-files | grep -E '^data/(raw|build)/|\.(npy|npz|parquet|csv|xlsx|geojson)$'; then
            echo "Data files must never be committed"; exit 1
          fi
