name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
        env:
          ADMIN_TOKEN: ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run lint:words

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - name: Start backend in mock mode
        working-directory: backend
        env:
          WAYKIN_MOCK: "1"
          ADMIN_TOKEN: ci
        run: |
          nohup python -m uvicorn waykin.main:app --workers 1 --no-access-log --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8000/api/meta >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8000/openapi.json >/dev/null
      - run: npm run gen:types
        working-directory: frontend
      - run: git diff --exit-code frontend/src/api/types.gen.ts
