[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waykin"
version = "0.1.0"
description = "WayKin: uncertainty-aware walking routes with encrypted family sharing (natHacks 2026)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.1",
  "pyarrow>=15",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
build = ["osmnx>=1.9", "networkx>=3.2", "osmium>=4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["waykin*", "scripts*"]

[tool.setuptools.package-data]
waykin = ["mocks/*.json", "demo/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["timing: wall-clock performance checks, skipped in CI"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]   # pinned so every laptop and CI agree
