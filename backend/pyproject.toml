[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waykin"
version = "0.1.0"
description = "WayKin: walking routes scored by reported incidents, with abstention and an end-to-end encrypted family relay."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "shapely>=2",
    "pyproj>=3.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
build = ["osmnx>=1.9", "networkx>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["."]
include = ["waykin*", "scripts*"]

[tool.setuptools.package-data]
waykin = ["mocks/*.json", "demo/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"waykin/constants.py" = ["E501"]   # values copied verbatim from the contract (B3)
